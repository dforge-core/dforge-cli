name: publish

# Manual publish flow: pull binaries from a release on iash44/dForge-core,
# bump versions, publish to npm. Never auto-triggers — a bad release tag must
# not silently become `latest`. Run via:
#   gh workflow run publish.yml \
#     --repo dforge-core/dforge-cli \
#     -f source_tag=cli-v0.1.0-rc.2 \
#     -f npm_version=0.1.0-rc.2 \
#     -f npm_tag=next
# Promote to latest with a second run using -f npm_tag=latest.

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'cli-vX.Y.Z tag in iash44/dForge-core to fetch binaries from'
        required: true
        type: string
      npm_version:
        description: 'npm version to publish, e.g. 0.1.0-rc.2'
        required: true
        type: string
      npm_tag:
        description: 'npm dist-tag'
        required: false
        type: string
        default: 'next'

permissions:
  contents: read
  # id-token: write enables both npm Trusted Publisher (OIDC auth — no
  # NPM_TOKEN secret needed) AND npm provenance (--provenance is passed
  # unconditionally in publish.sh). Both reuse the same GitHub OIDC token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          # Node 24 LTS — ships with npm 11.x, which has Trusted Publisher
          # OIDC support built in. Node 22 ships npm 10.9.7 (no OIDC), and
          # `npm install -g npm@latest` is unreliable on Linux runners
          # (arborist self-upgrade leaves missing-module state).
          node-version: '24'
          # Intentionally NO registry-url: when set, setup-node writes a
          # .npmrc with `_authToken=${NODE_AUTH_TOKEN}` placeholder. Without
          # NODE_AUTH_TOKEN set, npm publish sees a literal fake token
          # ("XXXXX-XXXXX-XXXXX-XXXXX"), tries to auth with it, gets 404
          # — and never falls back to the OIDC Trusted Publisher exchange.
          # Default registry is npmjs.org anyway.

      - name: Fetch binaries from source-repo release
        env:
          # Source repo iash44/dForge-core is private and lives under a
          # different owner than this dist repo, so the workflow-issued
          # GITHUB_TOKEN can't reach it. SOURCE_REPO_PAT is a fine-grained
          # PAT with Contents: Read on iash44/dForge-core, stored as a
          # repo secret on dforge-core/dforge-cli.
          GH_TOKEN: ${{ secrets.SOURCE_REPO_PAT }}
        run: scripts/fetch-binaries.sh "${{ inputs.source_tag }}"

      # Auth is via npm Trusted Publisher (configured in the npm UI under
      # @dforge-core/dforge-cli → Settings → Trusted Publisher). The OIDC
      # token issued by the id-token: write permission above is exchanged
      # for a short-lived publish credential at publish time — no NPM_TOKEN
      # secret needed. Provenance piggybacks on the same OIDC exchange.
      - name: Publish to npm
        run: |
          scripts/publish.sh \
            --version "${{ inputs.npm_version }}" \
            --tag "${{ inputs.npm_tag }}" \
            --yes
