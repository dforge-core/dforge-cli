name: publish

# Manual publish flow: pull binaries from a release on iash44/dForge-core,
# bump versions, publish to npm. Never auto-triggers — a bad release tag must
# not silently become `latest`. Run via:
#   gh workflow run publish.yml \
#     --repo dforge-core/dforge-cli \
#     -f source_tag=cli-v0.1.0-rc.2 \
#     -f npm_tag=next
#
# npm_version is optional: omit it and the version is derived from the fetched
# binary (dforge-cli --version). Pass -f npm_version=X.Y.Z only to override or
# pin explicitly — it's then validated against the binary.
#
# Promote to latest with a second run using -f npm_tag=latest. publish.sh
# auto-detects that the version is already published and switches to a
# promote-only path that just runs `npm dist-tag add` (no republish).
# Requires NPM_PROMOTE_TOKEN secret — a regular automation token, since
# `npm dist-tag` doesn't go through the Trusted Publisher OIDC channel.

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'cli-vX.Y.Z tag in iash44/dForge-core to fetch binaries from'
        required: true
        type: string
      npm_version:
        description: 'npm version (leave blank to derive from the binary)'
        required: false
        type: string
      npm_tag:
        description: 'npm dist-tag'
        required: false
        type: string
        default: 'next'

permissions:
  contents: read
  # id-token: write enables both npm Trusted Publisher (OIDC auth — no
  # NPM_TOKEN secret needed) AND npm provenance (--provenance is passed
  # unconditionally in publish.sh). Both reuse the same GitHub OIDC token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          # Node 24 LTS — ships with npm 11.x, which has Trusted Publisher
          # OIDC support built in. Node 22 ships npm 10.9.7 (no OIDC), and
          # `npm install -g npm@latest` is unreliable on Linux runners
          # (arborist self-upgrade leaves missing-module state).
          node-version: '24'
          # Intentionally NO registry-url: when set, setup-node writes a
          # .npmrc with `_authToken=${NODE_AUTH_TOKEN}` placeholder. Without
          # NODE_AUTH_TOKEN set, npm publish sees a literal fake token
          # ("XXXXX-XXXXX-XXXXX-XXXXX"), tries to auth with it, gets 404
          # — and never falls back to the OIDC Trusted Publisher exchange.
          # Default registry is npmjs.org anyway.

      # Install wrapper dev deps so tsup is on PATH for the wrapper's
      # `prepublishOnly` hook. The 6 sidecar packages have no devDeps and
      # no hooks, so they don't need this — but the wrapper's npm publish
      # silently fails without tsup available. --ignore-scripts skips the
      # optionalDependencies binary download for sidecars (those binaries
      # come from fetch-binaries.sh below, not from the optionalDeps).
      - name: Install wrapper dev deps (for tsup)
        run: pnpm install --ignore-scripts --no-frozen-lockfile

      - name: Fetch binaries from source-repo release
        env:
          # Source repo iash44/dForge-core is private and lives under a
          # different owner than this dist repo, so the workflow-issued
          # GITHUB_TOKEN can't reach it. SOURCE_REPO_PAT is a fine-grained
          # PAT with Contents: Read on iash44/dForge-core, stored as a
          # repo secret on dforge-core/dforge-cli.
          GH_TOKEN: ${{ secrets.SOURCE_REPO_PAT }}
        run: scripts/fetch-binaries.sh "${{ inputs.source_tag }}"

      # Auth is via npm Trusted Publisher (configured in the npm UI under
      # @dforge-core/dforge-cli → Settings → Trusted Publisher). The OIDC
      # token issued by the id-token: write permission above is exchanged
      # for a short-lived publish credential at publish time — no NPM_TOKEN
      # secret needed. Provenance piggybacks on the same OIDC exchange.
      - name: Publish to npm
        env:
          # NPM_PROMOTE_TOKEN: automation token used by `npm dist-tag add`
          # in the promote-only path. Trusted Publisher OIDC does not cover
          # dist-tag operations, so this token is required only for
          # promotions (e.g. moving `next` → `latest`). Initial publishes
          # of a version still use OIDC and don't touch this token. If
          # unset, only the publish path works; promote-only runs would
          # fail at the `npm dist-tag add` step.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PROMOTE_TOKEN }}
        run: |
          # Write .npmrc only if the token is present, so initial publishes
          # (OIDC) keep working unchanged when the secret hasn't been added.
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > ~/.npmrc
          fi
          # Always resolve a concrete version and pass it through. When
          # npm_version is blank we derive it from source_tag (cli-vX.Y.Z →
          # X.Y.Z) rather than leaving it unset. This is what makes a promote
          # run work: publish.sh's "already on npm → promote-only" auto-detect
          # (§0a) only fires when it has a version to probe, so an unset version
          # silently fell through to a full republish. On a REAL publish the
          # derived version is still asserted against the binary's self-reported
          # version by generate-sidecars.sh, so a tag/binary mismatch fails loud.
          VERSION="${{ inputs.npm_version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ inputs.source_tag }}"
            VERSION="${VERSION#cli-v}"
          fi
          scripts/publish.sh --version "$VERSION" --tag "${{ inputs.npm_tag }}" --yes
